# -------------------------------------------------------------------------
# ABHÄNGIGKEITEN (DEPENDENCIES)
# -------------------------------------------------------------------------

# 1. Die Haupt-StealthMod (Erfordert mindestens Version 1.0.10 die den Force HUD Schlüssel besitzt)
[[dependencies.parcoolstealthbridge]]
modId="stealth"
mandatory=true
versionRange="[1.0.10hotfix,)"
ordering="NONE"
side="BOTH"

# 2. ParCool (Erfordert mindestens Version 3.4.0, da hier HideInBlock hinzugefügt wurde)
[[dependencies.parcoolstealthbridge]]
modId="parcool"
mandatory=true
versionRange="[3.4.0,)"
ordering="NONE"
side="BOTH"

# 3. Der Vibrations-Fix (Sorgt für die akustische Koppelung)
[[dependencies.parcoolstealthbridge]]
modId="vibratingsteps"
mandatory=true
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"